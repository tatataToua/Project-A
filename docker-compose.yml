services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: askme
      POSTGRES_PASSWORD: askme
      POSTGRES_DB: askme
    # Bound to the loopback interface: the dev password is `askme`, so the
    # database must not be reachable from outside this machine.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - askme_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://askme:askme@postgres:5432/askme
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./docs/content:/docs/content:ro

volumes:
  askme_pgdata:
