services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: askme
      POSTGRES_PASSWORD: askme
      POSTGRES_DB: askme
    ports:
      - "5432:5432"
    volumes:
      - askme_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://askme:askme@postgres:5432/askme
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./docs/content:/docs/content:ro

volumes:
  askme_pgdata:
